name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in build.sh service.sh boot-completed.sh hotinstall.sh action.sh uninstall.sh customize.sh lib/core.sh tests/run.sh tests/fixtures/settings; do
            sh -n "$f"
          done

      - name: Offline test harness
        run: sh tests/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui-src/package-lock.json

      - name: Build WebUI
        run: |
          cd webui-src
          npm ci
          npm run build

      - name: Package module
        env:
          TT_SKIP_BUILD: "1"
        run: bash build.sh package

      - name: Show checksum
        run: cat choke-to-flow.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: choke-to-flow-module
          if-no-files-found: error
          path: |
            choke-to-flow.zip
            choke-to-flow.zip.sha256
